<script>
/* 閱讀器殼：章節切換用 iframe（不重載），背景音樂在這一層持續播放、跨章不斷。
   一次點「開啟聲音」解鎖，之後換章音樂連著走。開關同時寫 localStorage fx-bgm，
   章節（iframe）的火聲會跟著這個狀態同步。 */
(function(){
  // 這個殼不該被塞進別的 iframe
  if(window.top!==window.self){ location.replace('home.html'); return; }
  var btn=document.getElementById('snd');
  var A=document.getElementById('bgmA'), B=document.getElementById('bgmB');
  var cur=A,nxt=B,on=false,env=0,envTarget=0,fading=false,fadeT0=0,started=false;
  var VOL=0.34,FADE=5;
  function setBtn(){ btn.textContent = on ? '♪　聲音開啟中' : '♪　開啟聲音'; }
  setBtn();
  function tick(){
    requestAnimationFrame(tick);
    var now=performance.now()/1000;
    if(env<envTarget) env=Math.min(envTarget,env+(1/6)*0.016);
    else if(env>envTarget) env=Math.max(envTarget,env-(1/1.8)*0.016);
    if(on && cur.duration){
      if(!fading && cur.currentTime>cur.duration-FADE){ try{nxt.currentTime=0;nxt.play();}catch(e){} fading=true; fadeT0=now; }
      if(fading){ var p=Math.min(1,(now-fadeT0)/FADE);
        cur.volume=env*VOL*Math.cos(p*Math.PI/2); nxt.volume=env*VOL*Math.sin(p*Math.PI/2);
        if(p>=1){ try{cur.pause();}catch(e){} var t=cur;cur=nxt;nxt=t;fading=false; } }
      else { cur.volume=env*VOL; nxt.volume=0; }
    } else if(cur) cur.volume=env*VOL;
  }
  function onEnded(e){ if(!on||e.target!==cur) return; try{nxt.currentTime=0;nxt.volume=env*VOL;nxt.play();}catch(err){} var t=cur;cur=nxt;nxt=t;fading=false; }
  A.addEventListener('ended',onEnded); B.addEventListener('ended',onEnded);
  /* play() 被自動播放政策擋下來是 reject 不是 throw，catch 抓不到，
     所以要接 .catch，並掛上「下一次互動就接回去」的監聽（#43）。 */
  var waiting=false;
  var EV=['pointerdown','keydown','touchstart','wheel'];
  function resume(){ if(!waiting) return; waiting=false; offGesture(); if(on) start(); }
  function onGesture(){ EV.forEach(function(t){ addEventListener(t,resume,{capture:true}); });
    try{ var d=document.getElementById('page').contentDocument;
      if(d) EV.forEach(function(t){ d.addEventListener(t,resume,{capture:true}); }); }catch(e){}
    waiting=true; }
  function offGesture(){ EV.forEach(function(t){ removeEventListener(t,resume,{capture:true}); });
    try{ var d=document.getElementById('page').contentDocument;
      if(d) EV.forEach(function(t){ d.removeEventListener(t,resume,{capture:true}); }); }catch(e){} }
  function start(){ var pr; try{ pr=cur.play(); }catch(e){}
    if(pr&&pr.catch) pr.catch(function(){ onGesture(); });
    envTarget=1; on=true; if(!started){started=true;tick();} }
  function stop(){ envTarget=0; on=false; setTimeout(function(){ if(!on){try{A.pause();B.pause();}catch(e){}} },2000); }
  document.addEventListener('visibilitychange',function(){ if(on&&!document.hidden){try{cur.play();}catch(e){}} });
  function apply(){ setBtn(); try{localStorage.setItem('fx-bgm',on?'1':'0');}catch(e){} if(on) start(); else stop(); }
  btn.addEventListener('click',function(){ on=!on; apply(); });
  /* 預設想播：除非讀者按過關閉（fx-bgm==='0'），否則載入就嘗試播放；
     被自動播放政策擋下時，改在第一次互動（殼或章節任一邊）接回去。 */
  try{ if(localStorage.getItem('fx-bgm')!=='0'){ on=true; setBtn(); start(); } }catch(e){ on=true; setBtn(); start(); }
  var inst=document.getElementById('inst');
  [btn,inst].forEach(function(el){
    if(!el) return;
    setTimeout(function(){el.classList.add('rest');},10000);
    el.addEventListener('mouseenter',function(){el.classList.remove('rest');});
    el.addEventListener('mouseleave',function(){el.classList.add('rest');});
  });

  /* hash 路由 ↔ iframe：深連結、可分享、重整回到同一章 */
  var frame=document.getElementById('page');
  var MAP={home:'home.html', xu:'序章-閱讀版.html', ch1:'第一章-閱讀版.html',
            ch2:'第二章-閱讀版.html', ch3:'第三章-閱讀版.html',
            ch4:'第四章-閱讀版.html', ch5:'第五章-閱讀版.html',
            ch6:'第六章-閱讀版.html', ch7:'第七章-閱讀版.html', ch8:'第八章-閱讀版.html'};
  function pageFromHash(){ var h=(location.hash||'').replace(/^#/,''); return MAP[h]||'home.html'; }
  function load(p){ var s=frame.getAttribute('src'); if((s||'').split('/').pop()!==p) frame.setAttribute('src',p); }
  var want=pageFromHash(); if(want!=='home.html') load(want);
  addEventListener('hashchange',function(){ load(pageFromHash()); });
  frame.addEventListener('load',function(){
    if(waiting){ offGesture(); onGesture(); }
    try{
      var base=decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop());
      var key=null; for(var k in MAP){ if(MAP[k]===base) key=k; }
      if(key){ var h='#'+key; if(location.hash!==h) history.replaceState(null,'',h); }
    }catch(e){}
  });
})();
if('serviceWorker' in navigator){ addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

/* 自家安裝鈕：Chrome 桌機只在網址列給一個很小的圖示，多數人不會看到。
   關掉之後記住，已安裝就不再出現（PWA 守則）。 */
(function(){
  var btn=document.getElementById('inst'), deferred=null, KEY='tu-install';
  function get(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function set(v){ try{ localStorage.setItem(KEY,v); }catch(e){} }
  /* 'installed' = 永久不再問；數字 = 在這個時間之前不要再問（按取消只安靜兩週，
     不是永久，否則手滑按一次錯就再也裝不了）。 */
  function quiet(){ var v=get(); if(v==='installed') return true; return !!v && Date.now() < +v; }
  function hide(){ btn.classList.remove('show'); }
  addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferred=e;
    if(!quiet() && !matchMedia('(display-mode: standalone)').matches) btn.classList.add('show');
  });
  addEventListener('appinstalled',function(){ hide(); set('installed'); });
  btn.addEventListener('click',function(){
    if(!deferred){ hide(); return; }
    deferred.prompt();
    deferred.userChoice.then(function(r){
      if(r.outcome==='accepted') set('installed');
      else set(String(Date.now() + 14*864e5));   // 兩週後再問
      deferred=null; hide();
    });
  });
})();
</script>
