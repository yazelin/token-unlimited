## 八之一：快好了

陸修醒來的時候，樓下已經有人在走動。

他在床上躺了一會兒，聽見碗碰到桌面的聲音。一次。隔了兩口氣，又一次。

他下樓的時候，艾可已經坐在最裡面那一桌。簿子攤開，筆尖停在紙上。她抬頭看了他一下。

桌上有兩碗東西。

昆恩太太從灶間出來，把第三個碗放到艾可面前。

「妳先吃。」

「不用。」

昆恩太太看著她。艾可也看著她。

陸修坐下來。

「今天我幫妳。」他說。

昆恩太太轉頭看他。

「幫我什麼。」

他也不知道。

今天沒有委託。坡已經不在了，井有水，壓在底下的人昨晚還在呼吸。整條街的人都知道他做了什麼，沒有人再拿紙來找他。

昆恩太太把手在圍裙上擦了兩下。

「那你去看看蘿姆的布好了。」她說，「她昨天說快好了。好了就拿給小洛，他娘等著補他那件破衣服。」

陸修點頭。

事情有了。

他把碗裡的東西吃完。昆恩太太從他旁邊經過，看了一眼空碗。

「你吃太少了。」

陸修抬起頭。

她已經走進灶間。

＊＊＊

街北邊最後一戶的門開著。

織布機的聲音從裡面傳出來。一下一下。梭子推過去，推回來。

蘿姆嬸坐在機子後面，把已經織好的線往回挑。

一根。一根。

「又錯了一行？」陸修問。

她沒有抬頭。

「錯了一行。」

她把最後一根線挑出來，重新拿起梭子。

「快好了。」

昨天他站在這裡的時候，那塊布垂到她膝蓋下面。現在只到木架的一半。

陸修走近一點。

布的下面捲在橫木上。也許只是捲進去了。

「什麼時候能拿？」

「快好了。」

「下午？」

「快好了。」

那句話的語氣沒有變。

織布的人大概不喜歡別人一直問什麼時候好。前世他也被問過。什麼時候上線，什麼時候修完，為什麼昨天說今天、今天又說明天。

他沒有再問。

走出去以前，他回頭看了一眼。

梭子推過去，推回來。

那塊布還是只到木架的一半。

＊＊＊

小洛在樹下。兩桶水放在石桌旁邊，鵝散在路上啄東西。

奧德坐在原來的位置。腳邊那條狗趴著，鼻子壓在前腳上。

「這裡以前有兩口井。」奧德說。

「坡上還有一口。那是我小時候的事，後來塌了。」

「什麼時候塌的？」小洛問。

「六年前。」

「四年前。」小洛說，「我爸說是四年前，那年我五歲。」

奧德轉過去看他。

「……喔。」他說，「四年前。」

然後他點了點頭，好像剛才那句話是他自己講的。

小洛看見陸修，跑過來。

「你從哪裡來？」

「南邊。」

「南邊哪裡？」

「諾德。」

「你有沒有去過北邊那個村子？」

陸修沒有立刻回答。

那個孩子昨天問過一樣的問題。

也可能是前幾天。小孩子會重複問。尤其是聽到一個很大的故事，沒聽懂，隔天再問一次。

「去過。」陸修說。

「那裡有什麼？」

「沒有什麼。」

「沒有什麼是什麼？」

「就是沒有。」

「喔。」

小洛很快接受了。他提起兩桶水，往旅館走。

狗忽然睜開眼睛。

牠抬起頭，朝北邊看。

街另一頭傳來一聲狗叫。

接著是第二聲。第三聲。

整條街的狗一起叫了起來。

陸修回頭。

沒有東西。

叫聲在同一個地方停住。

不是一隻一隻停。所有的聲音一起斷掉。

奧德拿起桌上的一根草，在手裡繞。

「山上有東西下來吧。」旁邊的人說。

「今年雪來得早。」

奧德把草繞完，鬆手。

「以前不是這樣的。」

沒有人接話。

過了一會兒，旁邊的人講起別的事了。

## 八之二：門是關的

中午以前，蘿姆嬸的布還沒有好。

陸修又去了一次。

她正在把已經織好的線往回挑。

「錯了一行。」她說。

「妳早上也錯了一行。」

她的手停了一下。

「早上？」

「我來過。」

她看了他一眼，又看回機子。

「你可能看的是昨天。」

「我今天吃完早飯來的。」

「喔。」

她把最後一根線挑出來，重新拿起梭子。

「快好了。」

那塊布還是只到木架的一半。

「給小洛的那塊呢？」

「快好了。」

牆邊沒有疊好的布，只有一只籃子，籃子上面蓋著布。

陸修沒有去掀。

他走出門口，在門檻旁邊蹲下來。

地上有一小截斷線。他撿起來，繞在門邊那根木樁上，打了一個很鬆的結。

不知道為什麼要做這件事。

也許只是想知道自己下午是不是又把今天記成昨天。

＊＊＊

旅館裡比平常安靜。

艾可坐在原來的位置。她的筆在動。

昆恩太太從灶間端了一疊碗出來，往門口走。

門是關的。

她沒有停。

最上面那只碗先撞上去。她用手肘把它接回來，額頭碰在門板上，發出很輕的一聲。

陸修從桌邊站起來。

「昆恩太太？」

她往後退了一步，看著那扇門。

然後伸手把門打開。

「誰把門關了。」她說。

「剛才就是關的。」

「白天不關門。」

她端著碗走出去。

艾可抬頭看了一眼門，又低頭寫了一行。

「妳看到了？」陸修問。

「看到了。」

「她不知道門是關的。」

艾可看向門。

門現在開著。

「現在不是。」她說。

這個回答沒有錯。

＊＊＊

傍晚，小洛把兩桶水提進旅館後面。

放完以後，他跑進大堂，看到陸修，蹲在他旁邊。

「你從哪裡來？」

陸修看著他。

「南邊。」

「南邊哪裡？」

「諾德。」

「你有沒有去過北邊那個村子？」

「你今天問過了。」

「沒有。」

「早上，在樹下。」

「我早上在趕鵝。」

「你提著兩桶水。」

「我每天都提水。」

這也是真的。

小洛站起來。

「蘿姆嬸的布好了嗎？」

「還沒有。」

「她昨天就說快好了。」

「你知道？」

「她每天都說快好了。」

他說完跑出去。

陸修坐在原位。

街尾的織布機還在響。一下一下。

## 八之三：明天再看

天黑以前，陸修又走到街北邊。

門邊那根木樁上沒有線。

地上也沒有。

也許被風吹走了。那個結很鬆，斷線又輕。有人經過時衣角帶到，也會掉。

織布機的聲音從屋裡傳出來。

陸修沒有進去。

梭子推過去，推回來。

過了一會兒，聲音停了。

「錯了一行。」蘿姆嬸說。

她沒有抬頭。那句話不像是講給誰聽的。

陸修站了一會兒，轉身離開。

他沒有再放別的東西。

＊＊＊

樹下，奧德還坐著。

「這裡以前有兩口井。」老人說。

「坡上還有一口。那是我小時候的事，後來塌了。」

陸修站在旁邊。

「什麼時候塌的？」

「六年前。」

小洛不在。

沒有人糾正他。

奧德點了一下頭。

「以前不是這樣的。」

那條狗睜開眼睛，朝北邊看。

遠處有一隻狗叫了一聲。

所有的狗一起叫了起來。

然後一起停住。

「陸修。」

艾可站在樹外面。

他回頭。

「怎麼了？」

「昆恩太太在找你。」

「為什麼？」

「飯好了。」

＊＊＊

昆恩太太站在旅館門口。

門是關的。

她手裡端著一個碗。

陸修和艾可走近的時候，她往前走。

陸修停下來。

「門。」他說。

昆恩太太也停下來。

她看著那扇門。

「怎麼了？」

「是關的。」

「我知道。」

她伸手把門打開。

走進去以前，她回頭看了他一眼。

「你吃太少了。」

＊＊＊

那天晚上陸修沒有立刻上樓。

他坐在最裡面那一桌，看艾可寫。

昆恩太太收完東西，吹熄靠門的燈。門沒有關。外面的風進來，讓桌上的火晃了一下。

「妳覺得他們怎麼了？」陸修問。

艾可沒有停筆。

「誰？」

「蘿姆嬸。小洛。奧德。昆恩太太。」

她停下來。

陸修看向門。

「算了。」他說。

這些事每一個都可以解釋。

蘿姆嬸可能只是在重做一塊不滿意的布。小洛是小孩，重複問問題很正常。奧德老了，記錯年分也正常。昆恩太太忙了一整天，撞一次門沒有什麼。

狗聽見山上的東西。線被風吹走。

把它們放在一起，只是因為今天他一直在看。

「可能是這幾天太累了。」他說。

艾可看著他。

「坡塌了，鎮上有人受傷。大家沒睡好。」

她沒有說話。

「蘿姆嬸明天就會織完。」

他停了一下。

「明天再看。」

艾可低頭，在簿子上寫了一行。

「妳寫什麼？」

「明天再看。」

他站起來，上樓。

走到樓梯口的時候，他回頭。

艾可還坐在那裡。白袍太大，袖子蓋住手背，簿子攤在燈下面。

她低著頭，把今天那些話一行一行寫完。

＊＊＊

艾可等他的腳步聲停在樓上。

她把簿子翻到今天那一頁。

昆恩太太撞到門。

蘿姆嬸拆掉二十行。兩次。

奧德把六年前改成四年前。

小洛問他從哪裡來。兩次。

狗叫。一起停。

她在最後加了一行。

「明天再看。」

加完她把簿子闔上，雙手交疊，低頭。

還是那二十七個字。

唸完她抬起頭，等了一下。

沒有回應。

門在風裡慢慢闔上。

闔到一半，停住了。

過了一會兒，又從原來的位置闔了一次。
